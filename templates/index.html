<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Virtual IA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Archivo CSS desacoplado -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <main class="chat-container">
        <header class="chat-header">
            <h2>Asistente Inteligente</h2>
            <p>Conectado y listo para responder</p>
        </header>
        
        <section class="chat-messages" id="chatMessages">
            <article class="message bot">¡Hola! Soy tu agente de IA. ¿En qué puedo ayudarte hoy?</article>
        </section>

        <footer class="chat-input-area">
            <input type="text" id="userInput" placeholder="Escribe tu mensaje..." onkeydown="handleKeyPress(event)">
            <button id="sendButton" onclick="sendMessage()">Enviar</button>
        </footer>
    </main>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text || sendButton.disabled) return;

            appendMessage(text, 'user');
            userInput.value = '';
            sendButton.disabled = true;
            sendButton.textContent = 'Enviando...';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                let data = {};
                try {
                    data = await response.json();
                } catch (_) {
                    data = {};
                }

                if (response.ok) {
                    appendMessage(data.response, 'bot');
                } else {
                    appendMessage(data.detail || 'Ocurrió un error al procesar tu solicitud.', 'bot');
                }
            } catch (error) {
                appendMessage('No se pudo conectar con el servidor.', 'bot');
            } finally {
                sendButton.disabled = false;
                sendButton.textContent = 'Enviar';
                chatMessages.scrollTop = chatMessages.scrollHeight;
                userInput.focus();
            }
        }

        function appendMessage(text, sender) {
            const messageDiv = document.createElement('article');
            messageDiv.classList.add('message', sender);
            messageDiv.textContent = text;
            chatMessages.appendChild(messageDiv);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
